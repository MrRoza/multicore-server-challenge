syntax = "proto3";

option csharp_namespace = "Conduit.Comments.Integrations.Protos";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

service CommentsRpc {
  rpc List (ListCommentsMessage) returns (CommentListMessage);
  rpc Add (AddCommentMessage) returns (CommentMessage);
  rpc Delete (DeleteCommentMessage) returns (google.protobuf.Empty);
}

message ListCommentsMessage {
  int64 viewer = 1;
  string slug = 2;
}

message AddCommentMessage {
  int64 viewer = 1;
  string slug = 2;
  google.protobuf.StringValue body = 3;
}

message DeleteCommentMessage {
  int64 viewer = 1;
  string slug = 2;
  string id = 3;
}

message CommentAuthorMessage {
  string username = 1;
  google.protobuf.StringValue bio = 2;
  google.protobuf.StringValue image = 3;
  bool following = 4;
}

message CommentMessage {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  string body = 4;
  CommentAuthorMessage author = 5;
}

message CommentListMessage {
  repeated CommentMessage comments = 1;
}
