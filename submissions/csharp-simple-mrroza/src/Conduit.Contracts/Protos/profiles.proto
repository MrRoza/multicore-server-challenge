syntax = "proto3";

option csharp_namespace = "Conduit.Contracts";

import "common.proto";

service ProfilesRpc {
  rpc Get (ProfileRequestMessage) returns (ProfileMessage);
  rpc Follow (ProfileRequestMessage) returns (ProfileMessage);
  rpc Unfollow (ProfileRequestMessage) returns (ProfileMessage);
}

message ProfileRequestMessage {
  int64 viewer = 1;
  string username = 2;
}
