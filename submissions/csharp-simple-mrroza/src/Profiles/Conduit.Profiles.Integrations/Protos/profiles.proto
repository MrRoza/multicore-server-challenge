syntax = "proto3";

option csharp_namespace = "Conduit.Profiles.Integrations.Protos";

import "google/protobuf/wrappers.proto";

service ProfilesRpc {
  rpc Get (ProfileRequestMessage) returns (ProfileMessage);
  rpc Follow (ProfileRequestMessage) returns (ProfileMessage);
  rpc Unfollow (ProfileRequestMessage) returns (ProfileMessage);
}

message ProfileRequestMessage {
  int64 viewer = 1;
  string username = 2;
}

message ProfileMessage {
  string username = 1;
  google.protobuf.StringValue bio = 2;
  google.protobuf.StringValue image = 3;
  bool following = 4;
}
